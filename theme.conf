[General]
# change to whatever, or replace.
background=background.jpg
# Sync the selected wallpaper from Shell27's settings.json when available (true/false).
# If Shell27 settings or its wallpaper file cannot be read, background above is used.
syncShell27Wallpaper=true
# Optional shared Shell27 settings JSON. %USER% is replaced with the selected login name.
# Leave empty to read /home/%USER%/.config/macbar/settings.json automatically.
macbarSettingsFile=